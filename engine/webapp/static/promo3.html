<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inyeon TikTok — 3 Pick your reader</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#05060f;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif}
  .stage{position:relative;width:405px;height:720px;overflow:hidden;background:#05060f;border-radius:8px;box-shadow:0 0 60px rgba(0,0,0,.6)}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,15,.4),rgba(5,6,15,.12) 42%,rgba(5,6,15,.72))}
  .cap{position:absolute;left:26px;right:26px;opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s;text-align:center}
  .cap.show{opacity:1;transform:translateY(0)}
  .top{top:84px}.mid{top:300px}
  .hook{font-weight:800;font-size:29px;line-height:1.18;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.85)}
  .hook .g{color:#e8c86c}.hook .jade{color:#8fe0bd}
  .sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:23px;color:#f1f0fb;margin-top:8px;text-shadow:0 2px 14px rgba(0,0,0,.85)}
  .cta{position:absolute;left:0;right:0;bottom:96px;text-align:center;opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}
  .cta.show{opacity:1;transform:translateY(0)}
  .cta .pill{display:inline-block;background:#e8c86c;color:#231b03;font-weight:800;font-size:18px;padding:12px 22px;border-radius:40px}
  .wm{position:absolute;left:0;right:0;bottom:40px;text-align:center;color:#e8dcc0;font-size:14px;letter-spacing:.04em;text-shadow:0 2px 10px rgba(0,0,0,.8)}
  .wm b{color:#e8c86c}
  .brand{position:absolute;top:34px;left:0;right:0;text-align:center;color:#fff;font-family:'Cormorant Garamond',serif;font-size:20px;letter-spacing:.06em;text-shadow:0 2px 10px rgba(0,0,0,.8)}
  .replay{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#161936;color:#e8c86c;border:1px solid #2a2d55;border-radius:30px;padding:8px 18px;font-size:13px;cursor:pointer}
</style></head>
<body>
  <div class="stage" id="stage">
    <video id="v" src="/vid/3" autoplay muted loop playsinline></video>
    <div class="veil"></div>
    <div class="brand">☾ Inyeon</div>
    <div class="cap top" id="c1"><div class="hook">This app lets you choose <span class="g">HOW</span> it reads you.</div></div>
    <div class="cap mid" id="c2"><div class="hook">Warm 🤍 · Blunt 😌 · Mystic ✨</div></div>
    <div class="cap mid" id="c3"><div class="hook">Same truth — <span class="g">your</span> voice.</div><div class="sub">Mine roasted me. 😳</div></div>
    <div class="cap top" id="c4"><div class="hook">Which reader are <span class="jade">you</span>?<br><span class="g">tag someone</span> 👇</div></div>
    <div class="cta" id="cta"><span class="pill">inyeon.onrender.com · free</span></div>
    <div class="wm">what's your inyeon? · <b>inyeon.onrender.com</b></div>
  </div>
  <button class="replay" onclick="run()">▶ Replay</button>
<script>
  const steps=[{el:'c1',on:200,off:2600},{el:'c2',on:2800,off:5200},{el:'c3',on:5400,off:8000},{el:'c4',on:8200,off:11500},{el:'cta',on:8800,off:11500}];
  let T=[];
  function clearAll(){T.forEach(t=>clearTimeout(t));T=[];['c1','c2','c3','c4','cta'].forEach(id=>document.getElementById(id).classList.remove('show'));}
  function run(){clearAll();steps.forEach(s=>{const e=document.getElementById(s.el);T.push(setTimeout(()=>e.classList.add('show'),s.on));T.push(setTimeout(()=>e.classList.remove('show'),s.off));});T.push(setTimeout(run,11800));}
  document.getElementById('v').addEventListener('loadeddata',run);run();
</script>
</body></html>
